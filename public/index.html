<!doctype html><html><head><meta charset=utf8><title>법인카드 관리 데모</title><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;
--bg:#F2F4F8;--panel:#FFFFFF;--ink:#191F28;--ink2:#4E5968;--muted:#6B7684;--faint:#8B95A1;--line:rgba(25,31,40,.08);--line2:rgba(25,31,40,.13);
--accent:#3D6AF2;--accent-press:#2F57D6;--accent-soft:#EDF2FF;--accent-ink:#2B54D0;
--amber:#A35C00;--amber-soft:#FFF3DF;--red:#D3343C;--red-soft:#FFECEC;
--app-bg:#FFFFFF;--app-canvas:#F2F4F7;--app-ink:#191F28;--app-muted:#6B7684;--app-line:rgba(25,31,40,.08);--app-soft:#F2F4F7;--app-accent:#3D6AF2;--app-accent-soft:#EDF2FF;--app-amber:#A35C00;--app-amber-soft:#FFF3DF;--app-red:#D3343C;--app-red-soft:#FFECEC;
--ease:cubic-bezier(.2,.7,.2,1);
--font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
--display:var(--font);--body:var(--font);--mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);overflow-x:clip;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
::selection{background:rgba(61,106,242,.18)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex-shrink:0}
*{scrollbar-width:thin;scrollbar-color:rgba(25,31,40,.18) transparent}

/* ── 상단 바 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:16px;padding:12px 24px}
.brand{display:flex;align-items:center;gap:12px;flex:1}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.brand div>span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.acts{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.acts button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 16px 6px 6px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.acts button:hover{color:var(--ink)}
.acts button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(25,31,40,.07);font-size:12px;font-weight:700}
.acts button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(25,31,40,.06),0 4px 12px rgba(25,31,40,.06)}
.acts button[aria-selected=true] i{background:var(--accent);color:#fff}
.pager{flex:1;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.pager button{height:38px;border:0;border-radius:999px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink);transition:background .2s var(--ease),transform .1s var(--ease)}
.pager button:hover{background:#E8EBF0}
.pager button:active{transform:scale(.97)}
.pager #next{background:var(--accent);color:#fff}
.pager #next:hover{background:var(--accent-press)}
.pager #reset{background:transparent;color:var(--muted)}
.pager #reset:hover{color:var(--ink);background:var(--bg)}
.pager button:disabled{opacity:.35;cursor:default;transform:none}
.pager .count{font-size:13px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px;padding:0 24px 12px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:999px;padding:5px 14px 5px 5px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .2s var(--ease),border-color .2s var(--ease)}
.chip:hover{border-color:rgba(25,31,40,.24)}
.chip b{width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.chip .w{font-size:11px;color:var(--faint);margin-left:-2px}
.chip[aria-current=true]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.chip[aria-current=true] b{background:var(--accent);color:#fff}
.chip[aria-current=true] .w{color:var(--accent-ink);opacity:.7}

/* ── 본문 배치 ── */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,clamp(420px,36vw,560px));min-height:calc(100vh - var(--hdr,120px))}
.stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 24px 48px;background:linear-gradient(165deg,#EDF1FF 0%,#F2F0FD 50%,#F6F3FA 100%)}
.ctx{width:100%;max-width:1040px;display:grid;gap:12px}
.scn{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
.scn b{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-ink);background:#fff;border-radius:999px;padding:2px 10px;margin-right:8px;vertical-align:1px}
.cast{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.cast-l{font-size:12px;color:var(--muted);align-self:center;margin-right:4px;line-height:1.45}
.who{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:10px 14px 10px 10px;background:rgba(255,255,255,.62);color:var(--ink);font:inherit;font-size:12.5px;line-height:1.45;flex:1 1 200px;max-width:340px;text-align:left;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
.who:hover{background:#fff}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;transition:background .2s var(--ease),color .2s var(--ease)}
.who .wt{display:block}
.who b{font-size:14px;font-weight:700}
.who .r{color:var(--muted);margin-left:6px;font-size:12px}
.who .st{color:var(--muted)}
.who.on{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,106,242,.12)}
.who.on .av{background:var(--accent);color:#fff}
.who.on .st{color:var(--ink2)}
div.who{cursor:default;background:#fff}
div.who .av{background:var(--red-soft);color:var(--red)}
.dev{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center}
.dev>.phone,.dev>.pc{position:sticky;top:calc(var(--hdr,120px) + 20px)}
.dev.enter>*{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ── 오른쪽 설명 ── */
.spec{background:#fff;border-left:1px solid var(--line);padding:32px 32px 56px}
.eyebrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.eyebrow>span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;font-weight:600}
.pill.a{background:var(--accent-soft);color:var(--accent-ink)}.pill.b{background:var(--bg);color:var(--ink2)}
.spec h1{font-size:28px;line-height:1.3;letter-spacing:-.025em;margin:16px 0 8px;font-weight:700;text-wrap:balance}
.spec .lead{font-size:16px;color:var(--ink2);line-height:1.7;margin:0 0 24px}
.try{background:var(--accent-soft);border-radius:20px;padding:16px 18px 18px;margin:0 0 8px;display:grid;gap:12px;font-size:14px;color:var(--ink);line-height:1.65}
.try::before{content:'직접 눌러 보기';display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-ink)}
.trybtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trybtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .2s var(--ease),transform .1s var(--ease)}
.trybtn:hover{background:var(--accent-press)}.trybtn:active{transform:scale(.97)}
.raw{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;display:grid;gap:4px}
.raw b{font-size:12px;color:var(--muted);font-weight:600}
.raw b:not(:first-child){margin-top:6px}
.raw code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;color:var(--ink2)}
.spec section{border-top:1px solid var(--line);padding:24px 0}
.spec .try+section{border-top:0}
.spec h2{font-size:16px;color:var(--ink);margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
.spec h2 small{font-weight:500;margin-left:6px}
.spec ul{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.spec li{position:relative;padding-left:20px;line-height:1.65;color:var(--ink2)}
.spec li::before{content:'';position:absolute;left:5px;top:.66em;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.spec ul.req li{padding-left:26px;color:var(--ink)}
.spec ul.req li::before{left:0;top:.28em;width:18px;height:18px;border-radius:50%;background:var(--accent-soft) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B54D0' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") no-repeat center/10px}
.addh{margin:18px 0 10px;font-size:13px;font-weight:700;color:var(--ink)}
.spec ul.add li{padding-left:26px;color:var(--ink)}
.spec ul.add li::before{left:0;top:.28em;width:18px;height:18px;border-radius:50%;background:#F1ECFF url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236A4BD8' stroke-width='3.2' stroke-linecap='round'><path d='M12 5v14M5 12h14'/></svg>") no-repeat center/10px}
.box{border-radius:18px;padding:16px 18px}
.box.p{background:var(--bg)}.box.w{background:var(--amber-soft)}.box.e{background:var(--bg)}
.box li{color:var(--ink)}
.box.w li::before{background:var(--amber)}
.qb{display:inline-block;font-size:11px;font-weight:700;color:var(--accent-ink);background:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.exp{display:grid;gap:8px}
.exp div{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--ink2);line-height:1.6}
.exp b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.foot{font-size:12.5px;color:var(--muted);line-height:1.7}
@media (max-width:1100px){.bar1{flex-wrap:wrap;row-gap:10px}.brand{flex:1 1 auto}.pager{flex:0 0 auto}.acts{order:3;flex-basis:100%;overflow-x:auto}}
@media (max-width:900px){.split{grid-template-columns:1fr}.dev>.phone,.dev>.pc{position:static}.spec{border-left:0;border-top:1px solid var(--line);padding:28px 16px 48px}.stage{padding:20px 16px 32px}}
@media (max-width:640px){.bar1{padding:10px 16px}.nav{padding:0 16px 10px}.brand div>span{display:none}.pager #reset{display:none}.pager button{padding:0 14px}.acts button{padding:6px 12px 6px 6px;font-size:13px}.cast{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}.cast::-webkit-scrollbar{display:none}.cast-l{display:none}.who{flex:0 0 auto;max-width:none}.spec h1{font-size:24px}}

/* ── 휴대폰 ── */
.phone{position:relative;width:360px;max-width:100%;height:clamp(580px,calc(100vh - var(--hdr,120px) - 48px),760px);background:#fff;border-radius:54px;padding:10px;box-shadow:0 0 0 1px rgba(25,31,40,.07),0 2px 6px rgba(25,31,40,.04),0 40px 70px -28px rgba(46,56,130,.35);flex-shrink:0}
.screen{position:relative;width:100%;height:100%;background:var(--app-canvas);color:var(--app-ink);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;font-size:14px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:92px;height:27px;border-radius:999px;background:#0C0E13;z-index:8}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 30px;height:48px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;flex-shrink:0}
.sbi{display:flex;gap:5px;align-items:center}
.appbar{display:flex;align-items:center;gap:8px;padding:6px 16px 10px 20px;min-height:48px}
.appbar .t{font-weight:700;font-size:18px;flex:1;letter-spacing:-.02em}
.back{border:0;background:none;line-height:0;cursor:pointer;color:var(--app-ink);padding:4px;margin-left:-8px;border-radius:10px}
.back:hover{background:rgba(25,31,40,.06)}
.icon-btn{width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--app-ink);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(25,31,40,.06)}
.appmark{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.appmark .am-i{width:28px;height:28px;border-radius:9px;background:var(--app-accent);color:#fff;display:grid;place-items:center}
.appicon{width:64px;height:64px;border-radius:20px;background:var(--app-accent);color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -10px rgba(61,106,242,.6)}
.body{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body>*{flex-shrink:0}
.bottom{padding:12px 16px 20px;border-top:1px solid var(--app-line);background:var(--app-bg)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:600;cursor:pointer;background:var(--app-accent);color:#fff;transition:background .2s var(--ease),transform .1s var(--ease),opacity .2s}
.btn:hover{background:var(--accent-press)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(25,31,40,.06);color:var(--app-ink);font-weight:600}
.btn.ghost:hover{background:rgba(25,31,40,.1)}
.btn.line{background:#fff;color:var(--app-ink);box-shadow:inset 0 0 0 1px var(--line2);font-weight:600}
.btn.line:hover{background:#F7F8FA}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:13px;border-radius:11px}
.btn.danger{background:var(--app-red-soft);color:var(--app-red)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btn:disabled:hover{background:var(--app-accent)}
.btn.line:disabled:hover{background:#fff}
.flabel{display:block;font-size:13px;font-weight:500;color:var(--app-muted);margin-bottom:6px}
.input{width:100%;border:1px solid var(--line2);border-radius:14px;padding:13px 14px;font-size:16px;background:#fff;color:var(--app-ink);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input:focus{outline:0;border-color:var(--app-accent);box-shadow:0 0 0 3px rgba(61,106,242,.15)}
textarea.input{min-height:64px;resize:vertical;font-size:14px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line2);background:#fff;color:var(--app-ink);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.opt:hover{border-color:rgba(25,31,40,.26)}
.opt.on{background:var(--app-accent-soft);border-color:var(--app-accent);color:var(--accent-ink);font-weight:600}
.opt.on .muted{color:var(--accent-ink);opacity:.75}
.opt:disabled{cursor:default;opacity:.7}
.card{border:0;border-radius:20px;padding:16px 18px;background:var(--app-bg)}
.card.tap{cursor:pointer}.card.tap:hover{box-shadow:0 0 0 1px var(--app-accent)}
.screen .body>div:has(>.tx),.screen .body>div:has(>.mt):not(.card):not(.result){background:var(--app-bg);border-radius:20px;padding:16px 18px 6px}
.screen .body>div:has(>.mt):not(.card):not(.result):not(:has(>.tx)){padding-bottom:14px}
.muted{color:var(--app-muted)}.small{font-size:12.5px}
.mt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--app-muted)}
.mt b{color:var(--app-ink);font-size:15px;font-weight:700}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.lbl{display:inline-block;font-size:11px;font-weight:600;border-radius:7px;padding:3px 8px;white-space:nowrap;line-height:1.4}
.lbl.ok{background:var(--app-accent-soft);color:var(--accent-ink)}.lbl.wa{background:var(--app-amber-soft);color:var(--app-amber)}.lbl.no{background:var(--app-red-soft);color:var(--app-red)}.lbl.gr{background:rgba(25,31,40,.06);color:var(--app-muted)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--app-line);transition:opacity .2s}
.tx:last-child{border-bottom:0}
.tx[role=button]:hover .m{color:var(--accent-ink)}
.tx .m{font-weight:600;font-size:15px;transition:color .2s var(--ease)}
.tx .amt{font-size:15px}
.tx .lbl{margin-top:4px}
.bar{height:8px;background:rgba(25,31,40,.07);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--app-accent);border-radius:99px;transition:width .5s var(--ease)}
.bar.wa i{background:#E59B1A}.bar.no i{background:var(--app-red)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:4px;border-radius:99px;background:rgba(25,31,40,.08);transition:background .3s var(--ease)}.steps i.on{background:var(--app-accent)}
.seg{display:flex;background:rgba(25,31,40,.06);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--app-muted);transition:background .2s var(--ease),color .2s var(--ease)}
.seg button:hover{color:var(--app-ink)}
.seg button.on{background:#fff;color:var(--app-ink);font-weight:700;box-shadow:0 1px 2px rgba(25,31,40,.08),0 2px 6px rgba(25,31,40,.05)}
.tabbar{display:flex;margin:-4px -8px -6px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:4px 0;font-size:11px;font-weight:500;color:#A1A9B3;cursor:pointer;transition:color .2s var(--ease)}
.tabbar button:hover{color:var(--app-muted)}
.tabbar button.on{color:var(--app-ink);font-weight:700}
.tabbar svg{width:23px;height:23px}
/* 주인공: 이번 달 내 카드 */
.card.hero{position:relative;overflow:hidden;color:#fff;padding:20px 20px 18px;border-radius:24px;gap:10px!important;background:linear-gradient(135deg,#3461F1 0%,#5A55EE 52%,#9A58DE 100%);box-shadow:0 16px 30px -16px rgba(76,80,230,.7)}
.card.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.24),transparent 55%);pointer-events:none}
.card.hero>*{position:relative;z-index:1}
.hero .mt,.hero .mt span{color:rgba(255,255,255,.84)}
.hero .mt b{color:#fff}
.hero .big{color:#fff;letter-spacing:-.03em}
.hero .bar{background:rgba(255,255,255,.24);height:6px}
.hero .bar i{background:#fff}

 if(n===3)return phone('처음 설정',head('홈 화면에 추가','앱처럼 쓰고 알림을 받으려면 꼭 필요해요')+`<div class="card" style="display:grid;gap:8px"><b>아이폰</b><div class="small">Safari 아래쪽 공유 버튼 → "홈 화면에 추가" → 추가</div><div class="small muted">아이폰은 홈 화면에 추가해야 알림을 받을 수 있어요.</div></div><div class="card" style="display:grid;gap:8px"><b>안드로이드</b><div class="small">Chrome 오른쪽 위 ⋮ → "홈 화면에 추가"</div></div>`,`<div style="display:grid;gap:8px"><button class="btn" data-act="onb">추가했어요 · 알림 허용하기</button></div>`);
 if(n===4){const ios=st.os==='ios',a=st.o1,b=st.o2;
  const flow=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px">${['카드 결제','내 휴대폰에 문자','앱에 자동 등록'].map((t,k)=>`${k?'<span class="muted">→</span>':''}<span class="lbl gr" style="font-size:12px;padding:4px 8px">${t}</span>`).join('')}</div>`;
  const step=(no,t,sub,done,btn,act,dis)=>`<div class="card" style="display:grid;gap:8px${dis?';opacity:.5':''}"><div class="mt"><b>${no}. ${t}</b>${done?'<span class="lbl ok">완료</span>':''}</div><div class="small muted">${sub}</div>${done?'':`<button class="btn ${no===1?'':'line '}sm" data-act="${act}"${dis?' disabled':''} style="width:100%">${btn}</button>`}</div>`;
  const s1=ios?step(1,'단축어 설치하기','회사에서 만든 단축어를 내 아이폰에 넣어요',a,'단축어 설치하기','o1',false):step(1,'전달 앱 설치하기','회사에서 안내한 문자 전달 앱을 설치해요',a,'전달 앱 설치하기','o1',false);
  const s2=ios?step(2,'자동 실행 켜기','설치한 단축어가 신한카드 문자를 받으면 혼자 실행되게 켜요',b,'켰어요','o2',!a):step(2,'앱에서 연결 누르기','앱을 열고 "연결"을 누르면 내 계정과 자동으로 이어져요',b,'연결했어요','o2',!a);
  const s3=`<div class="card" style="display:grid;gap:8px${a&&b?'':';opacity:.5'}"><div class="mt"><b>3. 잘 되는지 확인</b>${st.smsTest?'<span class="lbl ok">완료</span>':''}</div>${st.smsTest?'<div class="result ok">연결됐어요. 시험 문자 1건을 받았어요.</div>':`<div class="small muted">시험 문자를 보내 앱에 들어오는지 확인해요</div><button class="btn line sm" data-act="smsTest"${a&&b?'':' disabled'} style="width:100%">시험 문자 보내기</button>`}</div>`;
  return phone('처음 설정',head('결제 문자 전달 켜기','카드를 쓰면 결제 문자가 앱으로 자동으로 넘어와요')+flow+`<div class="seg"><button class="${ios?'on':''}" data-os="ios">아이폰</button><button class="${ios?'':'on'}" data-os="android">안드로이드</button></div>`+s1+s2+s3,`<button class="btn" data-act="onb"${st.smsTest?'':' disabled'}>설정 마치기</button>`);}
 return phone(null,`<div class="done"><div class="check">${I.check}</div><div style="font-size:20px;font-weight:700">준비가 끝났어요</div><div class="muted">이제 법인카드를 쓰면<br>내역이 저절로 올라와요.</div></div><div class="card small muted">관리자 화면에 "문자 전달 설정 완료"로 표시돼요.</div>`,`<button class="btn" data-go="s4">홈으로</button>`);},

 `<div class="small muted">입력하지 않은 내역이 있으면 매일 아침 9시에 알려 드려요.</div>`;

 const dr=x.s||st.draft[x.id]||'',done=!!x.s;

 `<div><span class="flabel">계정과목</span><div style="display:grid;gap:6px">${SUBJ.map(([s,d])=>`<button class="opt${dr===s?' on':''}" data-subj="${s}" style="display:flex;justify-content:space-between;border-radius:10px;text-align:left;padding:8px 11px"${done?' disabled':''}><span>${s}</span><span class="small muted">${d}</span></button>`).join('')}</div></div>`+
 `<div><span class="flabel">함께 사용한 사람</span><div class="opts">${ppl.map(p=>`<button class="opt${st.withp.includes(p)?' on':''}" data-with="${p}"${done?' disabled':''}>${p}</button>`).join('')}${done?'':soon('+ 외부인','opt','외부인 추가 기능은 데모에서 생략되었습니다|실제 개발 때 만드는 기능: 함께 쓴 외부인 이름·회사 적기')}</div></div>`+
 `<div class="small muted">적요와 이용 사유 칸은 데모에서 뺐어요.</div>`+
 (done?`<div class="result ok">입력했어요. ${x.s} 남은 예산: ${won(BUD[x.s]-used(x.s))}</div>`:'');
 return phone('내역 입력',body,done?`<div class="row" style="display:flex;gap:8px"><button class="btn ghost" data-act="selBack">목록으로</button><button class="btn" data-go="s6">예산 보기</button></div>`:`<button class="btn" data-act="enter"${dr?'':' disabled'}>입력 완료</button>`,{backAct:'selBack'});},

 return phone('부서 사용내역',body,`<nav class="tabbar"><button class="on">${I.s5}<span>부서 내역</span></button>${soon(I.card+'<span>내 카드</span>','','내 카드 화면은 데모에서 생략되었습니다|실제로는 직원 화면과 같은 방식으로 입력합니다.')}${soon(I.me+'<span>내 정보</span>','','내 정보 기능은 데모에서 생략되었습니다|실제 개발 때 만드는 기능: 비밀번호 변경, 알림함')}</nav>`,{sheet});},

 if(d.person){const id=d.person;if(id==='E2041'){go('s7');return;}st.who=id;st.sel=null;st.push=false;st.withp=[];const cur=S[st.i].id;if(!['s3','s4','s5','s6'].includes(cur))go('s4');else render();flash('<b>'+PP[id].n+'님 화면으로 바꿨어요</b>카드 '+PP[id].card+'의 내역과 한도로 보여요.',true);return;}
 if(d.with){const k=st.withp.indexOf(d.with);k>=0?st.withp.splice(k,1):st.withp.push(d.with);render();return;}
 if(d.btab){st.btab=d.btab;render();return;}
 if(d.dept){st.dept=d.dept;render();return;}
 if(d.sheet!==undefined){st.sheet=+d.sheet;render();return;}
 if(d.f8!==undefined){st.f8=st.f8===d.f8?'':d.f8;render();return;}
 if(d.rc){st.rc[d.rc]=true;render();return;}
 if(d.unl){st.unlockOpen=d.unl;render();return;}
 if(d.resend){st.resent[d.resend]=true;flash(d.resend+'님께 설정 안내를 다시 보냈어요');return;}
 switch(d.act){
  case 'flashClose':st.flash='';clearTimeout(flashT);placeToast();break;
  case 'soon':{const [h,b]=String(d.msg).split('|');flash(b?`<b>${esc(h)}</b>${esc(b)}`:esc(h));break;}
  case 'impOpen':st.modal=true;render();break;
  case 'impClose':st.modal=false;render();break;
  case 'impDo':st.modal=false;st.imp=true;st.log.push('11/02 10:14 이수진 · 엑셀로 7명 등록 (경고 2행 제외)');flash('7명을 등록했어요. 경고가 있던 2행은 반영하지 않았어요');break;
  case 'saveBud':{const ch=Object.keys(st.budDraft).filter(k=>st.budDraft[k]!==BUD[k]&&st.budDraft[k]>0);ch.forEach(k=>BUD[k]=st.budDraft[k]);Object.keys(st.budDraft).forEach(k=>st.budDraft[k]=BUD[k]);st.chg=ch;const wc=st.warn!==st.draftWarn;st.warn=st.draftWarn;st.saved=true;flash(ch.length||wc?'<b>저장했어요</b>'+(ch.length?ch.map(k=>k+' '+won(BUD[k])).join(', ')+'. ':'')+'6번 예산 화면에 바로 반영돼요.':'바뀐 값이 없어요');break;}
  case 'onb':st.onb++;render();break;
  case 'smsTest':st.smsTest=true;render();break;
  case 'o1':st.o1=true;render();break;
  case 'o2':st.o2=true;render();break;
  case 'sms':if(st.got[st.who]){flash('이미 오늘 결제 문자를 받았어요. 홈의 내역을 눌러 입력해 보세요');break;}if(S[st.i].id!=='s4')st.i=S.findIndex(x=>x.id==='s4');st.got[st.who]=true;st.push=true;render();setTimeout(()=>{st.push=false;render();},4000);break;
  case 'enter':{const x=st.tx.find(t=>t.id===st.sel);if(x&&st.draft[x.id]){x.s=st.draft[x.id];}render();break;}
  case 'selBack':st.sel=null;render();break;
  case 'sheetClose':st.sheet=null;render();break;
  case 'rcUp':st.rc.up=true;render();break;
  case 'rcAll':st.rc={up:true,ok:true,diff:true,card:true,app:true};render();break;
  case 'close':st.closed=true;st.clog.push(T()+' 이수진 · 11월 전사 마감');render();break;
  case 'unlockCancel':st.unlockOpen=null;render();break;
  case 'unlockDo':{const r=document.getElementById('ur');st.unlock=st.unlockOpen;st.clog.push(T()+' 이수진 · '+st.unlock+' 마감 해제 (사유: '+(r?r.value:'')+')');st.unlockOpen=null;render();break;}
  case 'relock':st.clog.push(T()+' 이수진 · '+st.unlock+' 다시 마감');st.unlock=null;render();break;
  case 'reparse':st.reparsed=true;flash('읽는 규칙을 고친 뒤 2건을 다시 읽어 등록했어요');break;
 }
});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.bud)flash('<b>예산 바꾸기</b>숫자를 고치고 위의 "저장"을 누르면 6번 예산 화면에 반영돼요.',true);});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.bud;if(k){const n=parseInt(e.target.value.replace(/[^0-9]/g,''),10);st.budDraft[k]=isNaN(n)?0:n;}});
document.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.bud;if(k)e.target.value=st.budDraft[k].toLocaleString('ko-KR');});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.bud){e.preventDefault();e.target.blur();const b=document.querySelector('[data-act=saveBud]');if(b)b.click();}});
document.addEventListener('change',e=>{const d=e.target.dataset||{};if(d.role){const emp=emps().find(x=>x.id===d.role);const was=st.roles[d.role]||emp.r;st.roles[d.role]=e.target.value;st.log.push('11/02 10:'+String(20+st.log.length).padStart(2,'0')+' 이수진 · '+emp.n+' 권한 '+was+' → '+e.target.value);flash(emp.n+'님 권한을 '+e.target.value+'(으)로 바꿨어요. 변경 이력에 남아요');}});
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('[role=button]')){e.preventDefault();t.click();}});
$('#prev').addEventListener('click',()=>{if(st.i>0)go(S[st.i-1].id);});
$('#next').addEventListener('click',()=>{if(st.i<S.length-1)go(S[st.i+1].id);});
$('#reset').addEventListener('click',()=>{try{history.replaceState(null,'','#s1');}catch(e){}location.reload();});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(S[st.i].id!==id&&S.some(x=>x.id===id))go(id);});
const h=document.querySelector('header.top');const setH=()=>document.documentElement.style.setProperty('--hdr',h.offsetHeight+'px');setH();window.addEventListener('resize',setH);
const start=S.findIndex(x=>x.id===location.hash.slice(1));if(start>=0){st.i=start;catchUp(start);}
render();
}
</script>


<script>
/* 방문 추적: /v/<이름> 링크로 들어온 방문을 /api/visit 에 한 번 보냅니다 */
(function(){try{
 var m=location.pathname.match(/^\/v\/([^\/?#]+)/);
 var who=m?decodeURIComponent(m[1]):(new URLSearchParams(location.search).get('u')||'');
 var key='visit:'+who;
 if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');
 var body=JSON.stringify({who:who,path:location.pathname+location.hash,ref:document.referrer||'',lang:navigator.language||'',screen:screen.width+'x'+screen.height});
 if(navigator.sendBeacon)navigator.sendBeacon('/api/visit',new Blob([body],{type:'application/json'}));
 else fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true});
}catch(e){}})();
</script>
